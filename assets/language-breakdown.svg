<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Programming language breakdown</title>
  <desc id="desc">JavaScript 63.3 percent, Python 30.5 percent, HTML 4.4 percent, CSS 1.0 percent, other languages 0.8 percent across public repositories, snapshot November 16, 2026.</desc>
  <rect width="900" height="230" rx="20" fill="#0d1117"/>
  <text x="32" y="42" fill="#7ee7d8" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LANGUAGES ACROSS PUBLIC REPOSITORIES</text>
  <text x="868" y="42" text-anchor="end" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">Snapshot · 16 Nov 2026</text>
  <defs><clipPath id="bar"><rect x="32" y="70" width="836" height="18" rx="9"/></clipPath></defs>
  <g clip-path="url(#bar)">
    <rect x="32" y="70" width="528.9" height="18" fill="#f1e05a"/>
    <rect x="560.9" y="70" width="255.1" height="18" fill="#3572A5"/>
    <rect x="816" y="70" width="36.8" height="18" fill="#e34c26"/>
    <rect x="852.8" y="70" width="8.4" height="18" fill="#563d7c"/>
    <rect x="861.2" y="70" width="6.8" height="18" fill="#8b949e"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14">
    <circle cx="42" cy="125" r="6" fill="#f1e05a"/><text x="58" y="130" fill="#f0f6fc">JavaScript</text><text x="184" y="130" fill="#8b949e">63.3%</text>
    <circle cx="270" cy="125" r="6" fill="#3572A5"/><text x="286" y="130" fill="#f0f6fc">Python</text><text x="385" y="130" fill="#8b949e">30.5%</text>
    <circle cx="470" cy="125" r="6" fill="#e34c26"/><text x="486" y="130" fill="#f0f6fc">HTML</text><text x="560" y="130" fill="#8b949e">4.4%</text>
    <circle cx="640" cy="125" r="6" fill="#563d7c"/><text x="656" y="130" fill="#f0f6fc">CSS</text><text x="720" y="130" fill="#8b949e">1.0%</text>
    <circle cx="42" cy="170" r="6" fill="#8b949e"/><text x="58" y="175" fill="#f0f6fc">Other languages</text><text x="184" y="175" fill="#8b949e">0.8%</text>
  </g>
  <text x="32" y="210" fill="#6e7681" font-family="Segoe UI,Arial,sans-serif" font-size="11">Based on language bytes reported by GitHub for public repositories. Percentages rounded.</text>
</svg>

